<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ร้านปลาย่าง</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b6fb5;font-family:system-ui,"Noto Sans Thai",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #0009}
  #cfgBtn{position:fixed;top:34px;right:10px;background:#0d1b3aaa;color:#fff;border:1px solid #fff5;border-radius:12px;padding:6px 10px;font-size:13px}
  #toast{position:fixed;left:12px;right:12px;bottom:64px;display:none;background:#0d1b3acc;backdrop-filter:blur(6px);color:#fff;border:1px solid #ffffff44;border-radius:18px;padding:12px 16px;text-align:center;pointer-events:none}
  #tName{font-size:19px;font-weight:700;color:#ffd666}
  #tWho{font-size:13px;opacity:.8;margin-top:2px}
  #tText{font-size:16px;line-height:1.5;margin-top:6px}
  #tLucky{font-size:13px;opacity:.8;margin-top:6px}
  #bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:6px;overflow-x:auto}
  #bar button{flex:0 0 auto;background:#ffffff30;color:#fff;border:1px solid #fff6;border-radius:12px;padding:8px 10px;font-size:12px}
  #cfg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
  #cfg .card{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
  #cfg h3{margin:0 0 10px;font-size:17px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
  .row .opts{display:flex;gap:4px}
  .row button{border:1px solid #ccc;background:#f4f4f4;border-radius:10px;padding:6px 8px;font-size:13px}
  .row button.on{background:#2563eb;color:#fff;border-color:#2563eb}
  #cfgClose{margin-top:12px;width:100%;padding:10px;border:0;border-radius:12px;background:#111;color:#fff;font-size:15px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><span id="stat"></span><span id="status">⚪ ออฟไลน์</span></div>
<button id="cfgBtn">⚙️ บทบาท</button>
<div id="toast"><div id="tName"></div><div id="tWho"></div><div id="tText"></div><div id="tLucky"></div></div>
<div id="bar"></div>
<div id="cfg"><div class="card">
  <h3>เลือกบทบาทของแต่ละเลเวล</h3>
  <div id="rows"></div>
  <button id="cfgClose">เสร็จ</button>
</div></div>
<script src="data.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
