<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ศาลเจ้ามงคล">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ศาลเจ้ามงคล</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ย่อ/ขยายเกมให้พอดีหน้าจอ เห็นครบทุกส่วน
  function fit() { var h = window.innerHeight, s = Math.min(innerWidth / 720, h / 1280), c = document.getElementById('c'); c.style.width = 720 * s + 'px'; c.style.height = 1280 * s + 'px'; }
  addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 300); }); fit();
  // กันซูมด้วยการบีบนิ้วและกันเลื่อนหน้าจอ
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (e) { document.addEventListener(e, function (ev) { ev.preventDefault(); }); });
  document.addEventListener('touchmove', function (ev) { ev.preventDefault(); }, { passive: false });
  // ลงทะเบียน service worker (จำเป็นให้ Chrome แสดงปุ่ม "ติดตั้งแอป")
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  // ถ้าเปิดในเบราว์เซอร์ปกติ (ไม่ได้ติดตั้งแอป) ให้เข้าเต็มจอเมื่อแตะหน้าจอครั้งแรก
  document.addEventListener('click', function () {
    var full = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches;
    if (!full && !document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
    }
  }, { once: true });
</script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
<script src="scene.js"></script>
</body>
</html>
